<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffc129">
  <meta name="description" content="Alat interaktif wang Malaysia untuk murid Matematik Tahun 5.">
  <title>Smart Money Tool - Math Year 5</title>
  <link rel="icon" type="image/png" href="edcloud-app-icon.png">
  <link rel="preload" href="assets/ui-icons/sound-off.png" as="image" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="auth-gate" id="authGate" role="status" aria-live="polite" aria-atomic="true" aria-labelledby="authTitle">
    <div class="auth-card">
      <span class="auth-indicator" aria-hidden="true"></span>
      <h1 id="authTitle">Connecting to EdCloud…</h1>
      <p id="authMessage">Please wait while your secure tool session is verified.</p>
    </div>
  </section>

  <div class="page-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="edcloud-app-icon.png" alt="" aria-hidden="true" draggable="false">
        <div>
          <h1 data-i18n="title">Jom Kenali Wang!</h1>
          <p data-i18n="subtitle">Kenal, susun dan urus wang dengan bijak.</p>
        </div>
      </div>

      <div class="top-actions">
        <button id="fullscreenToggle" class="fullscreen-button" type="button" aria-pressed="false">
          <span aria-hidden="true">⛶</span>
          <span data-i18n="fullscreen">Skrin penuh</span>
        </button>
        <button id="soundToggle" class="sound-button" type="button" aria-pressed="true">
          <img id="soundIcon" class="sound-icon" src="assets/ui-icons/sound-on.png" width="28" height="28" alt="" aria-hidden="true" draggable="false">
          <span data-i18n="soundOn">Bunyi</span>
        </button>
        <div class="language-switch" role="group" aria-label="Language">
          <button type="button" data-lang="ms" class="language-btn active" aria-pressed="true">BM</button>
          <button type="button" data-lang="zh" class="language-btn" aria-pressed="false">中文</button>
          <button type="button" data-lang="en" class="language-btn" aria-pressed="false">EN</button>
        </div>
      </div>
    </header>

    <nav class="mode-tabs" id="modeTabs" aria-label="Aktiviti utama">
      <button type="button" data-mode="money" class="active" aria-pressed="true"><img class="mode-icon" src="assets/activity-icons/identify.png" width="52" height="52" alt="" aria-hidden="true" draggable="false"><span data-i18n="tabMoney">Kenal &amp; Bina</span></button>
      <button type="button" data-mode="spend" aria-pressed="false"><img class="mode-icon" src="assets/activity-icons/pay.png" width="52" height="52" alt="" aria-hidden="true" draggable="false"><span data-i18n="tabSpend">Bayar</span></button>
      <button type="button" data-mode="manage" aria-pressed="false"><img class="mode-icon" src="assets/activity-icons/budget.png" width="52" height="52" alt="" aria-hidden="true" draggable="false"><span data-i18n="tabManage">Urus Wang</span></button>
    </nav>

    <nav class="activity-tabs" id="activityTabs" aria-label="Aktiviti wang"></nav>

    <main class="workspace">
      <section class="activity-card" aria-live="polite">
        <div class="activity-heading">
          <div>
            <div class="eyebrow" data-i18n="tryIt">Mari cuba!</div>
            <h2 id="activityTitle"></h2>
          </div>
          <div class="heading-actions">
            <span id="gradeBadge" class="grade-badge">Matematik Tahun 5</span>
            <button id="teacherButton" class="teacher-button compact" type="button">👩‍🏫 <span data-i18n="teacherMode">Tetapan guru</span></button>
            <button id="resetToolButton" class="secondary-button compact" type="button">↻ <span data-i18n="resetTool">Tetapkan semula alat</span></button>
          </div>
        </div>

        <div id="challengePanel" class="challenge-panel"></div>
        <div id="visualStage" class="visual-stage"></div>
        <div id="controlArea" class="control-area"></div>
        <div id="liveSummary" class="feedback neutral" role="status" hidden></div>
      </section>
    </main>

    <div class="compat-controls" hidden aria-hidden="true">
      <h2 id="sideTitle">Kenal &amp; Bina</h2>
      <label for="gradeSelect" data-i18n="grade">Tahun</label>
      <select id="gradeSelect">
        <option value="2">Tahun 2</option>
        <option value="3">Tahun 3</option>
        <option value="4">Tahun 4</option>
        <option value="5">Tahun 5</option>
        <option value="6">Tahun 6</option>
      </select>
      <label for="activitySelect" data-i18n="activity">Aktiviti</label>
      <select id="activitySelect"></select>
      <div id="scopeNote"></div>
      <div id="tipBox"><span aria-hidden="true"></span><span></span></div>
    </div>
  </div>

  <footer class="forest-footer" aria-hidden="true" hidden></footer>

  <dialog id="teacherDialog" class="teacher-dialog">
    <form method="dialog" id="teacherForm">
      <button class="dialog-close" value="cancel" aria-label="Close" type="submit">×</button>
      <div class="eyebrow" data-i18n="teacherMode">Tetapan guru</div>
      <h2 data-i18n="customSettings">Tetapkan nilai demonstrasi</h2>
      <div class="divider"></div>
      <p data-i18n="customHelp">Gunakan nilai ini dalam alat semasa untuk demonstrasi kelas.</p>
      <div class="money-inputs">
        <div><label for="teacherRinggit" data-i18n="ringgit">Ringgit</label><input id="teacherRinggit" type="number" min="0" max="10000" value="56"></div>
        <div><label for="teacherSen" data-i18n="sen">Sen</label><input id="teacherSen" type="number" min="0" max="95" step="5" value="50"></div>
      </div>
      <div id="teacherPreview" class="teacher-preview">RM56.50</div>
      <p id="teacherError" class="dialog-error"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="secondary-button" data-i18n="cancel">Batal</button>
        <button type="button" id="useTeacherSettings" class="primary-button">✓ <span data-i18n="useSettings">Gunakan tetapan</span></button>
      </div>
    </form>
  </dialog>

  <template id="moneyCardTemplate">
    <button type="button" class="money-card">
      <span class="money-picture"><img alt=""><span class="contoh" aria-hidden="true">CONTOH</span></span>
      <span class="money-label"></span>
    </button>
  </template>

  <script src="grade-config.js"></script>
  <script type="module" src="auth-bootstrap.js"></script>
</body>
</html>
